{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "resqcloud"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "resqcloud-config",
    "namespace": "resqcloud"
  },
  "data": {
    "COORDINATOR_URL": "http://coordinator:8000",
    "RABBITMQ_HOST": "rabbitmq",
    "SHARDS": "http://shard0:8000,http://replica0:8000;http://shard1:8000,http://replica1:8000;http://shard2:8000,http://replica2:8000",
    "PYTHONUNBUFFERED": "1"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "rabbitmq-config",
    "namespace": "resqcloud"
  },
  "data": {
    "rabbitmq.conf": "loopback_users.guest = false\nvm_memory_high_watermark.absolute = 256MiB\ndisk_free_limit.absolute = 100MB\n"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "shard0",
    "namespace": "resqcloud"
  },
  "spec": {
    "selector": {
      "app": "shard0"
    },
    "ports": [
      {
        "port": 8000,
        "targetPort": 8000
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "shard0-headless",
    "namespace": "resqcloud"
  },
  "spec": {
    "selector": {
      "app": "shard0"
    },
    "ports": [
      {
        "port": 8000,
        "targetPort": 8000
      }
    ],
    "clusterIP": "None"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "shard0",
    "namespace": "resqcloud"
  },
  "spec": {
    "serviceName": "shard0-headless",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "shard0"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "shard0"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "shard0",
            "image": "resqcloud-backend:v1",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "uvicorn",
              "backend.storage:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000"
            ],
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "resqcloud-config"
                }
              }
            ],
            "env": [
              {
                "name": "SERVICE",
                "value": "shard0"
              },
              {
                "name": "NODE_ID",
                "value": "shard0"
              },
              {
                "name": "DB_PATH",
                "value": "/data/db.sqlite"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "192Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              }
            ]
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": "standard",
          "resources": {
            "requests": {
              "storage": "1Gi"
            }
          }
        }
      }
    ]
  }
}
