apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: resqcloud}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: YOUR_DOCKERHUB_USERNAME/resqcloud:latest
        command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: resqcloud}
spec:
  selector: {app: api}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coordinator, namespace: resqcloud}
spec:
  replicas: 1
  selector:
    matchLabels: {app: coordinator}
  template:
    metadata:
      labels: {app: coordinator}
    spec:
      containers:
      - name: coordinator
        image: YOUR_DOCKERHUB_USERNAME/resqcloud:latest
        command: ["uvicorn", "backend.coordinator:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: coordinator, namespace: resqcloud}
spec:
  selector: {app: coordinator}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: matcher, namespace: resqcloud}
spec:
  replicas: 1
  selector:
    matchLabels: {app: matcher}
  template:
    metadata:
      labels: {app: matcher}
    spec:
      containers:
      - name: matcher
        image: YOUR_DOCKERHUB_USERNAME/resqcloud:latest
        command: ["python", "-m", "backend.matcher"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: resqcloud}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: resqcloud}
spec:
  selector: {app: rabbitmq}
  ports: [{port: 5672, name: amqp}, {port: 15672, name: management}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-hpa, namespace: resqcloud}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
