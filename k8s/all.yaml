apiVersion: v1
kind: Namespace
metadata: {name: resqcloud}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: shard0, namespace: resqcloud}
spec:
  serviceName: shard0
  replicas: 1
  selector:
    matchLabels: {app: shard0}
  template:
    metadata:
      labels: {app: shard0}
    spec:
      containers:
      - name: storage
        image: YOUR_DOCKERHUB_USERNAME/resqcloud:latest
        command: ["uvicorn", "backend.storage:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - {name: NODE_ID, value: "shard0"}
        - {name: DB_PATH, value: "/data/db.sqlite"}
        volumeMounts:
        - {name: data, mountPath: /data}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: shard0, namespace: resqcloud}
spec:
  selector: {app: shard0}
  ports: [{port: 8000}]
---
