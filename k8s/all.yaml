{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "coordinator",
    "namespace": "resqcloud"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "coordinator"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "coordinator"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "coordinator",
            "image": "resqcloud-backend:v1",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "uvicorn",
              "backend.coordinator:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000"
            ],
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "resqcloud-config"
                }
              }
            ],
            "env": [
              {
                "name": "SERVICE",
                "value": "coordinator"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "96Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
