{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "rabbitmq-headless",
    "namespace": "resqcloud"
  },
  "spec": {
    "selector": {
      "app": "rabbitmq"
    },
    "ports": [
      {
        "name": "amqp",
        "port": 5672,
        "targetPort": 5672
      },
      {
        "name": "management",
        "port": 15672,
        "targetPort": 15672
      }
    ],
    "clusterIP": "None"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "rabbitmq",
    "namespace": "resqcloud"
  },
  "spec": {
    "serviceName": "rabbitmq-headless",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "rabbitmq"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "rabbitmq"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "rabbitmq",
            "image": "rabbitmq:3.13-management-alpine",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 5672
              },
              {
                "containerPort": 15672
              }
            ],
            "env": [
              {
                "name": "RABBITMQ_NODENAME",
                "value": "rabbit@rabbitmq-0"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "750m",
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/rabbitmq"
              },
              {
                "name": "rabbit-config",
                "mountPath": "/etc/rabbitmq/conf.d/90-resqcloud.conf",
                "subPath": "rabbitmq.conf"
              }
            ],
            "startupProbe": {
              "exec": {
                "command": [
                  "rabbitmq-diagnostics",
                  "-q",
                  "ping"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "rabbitmq-diagnostics",
                  "-q",
                  "ping"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10,
              "failureThreshold": 5
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "rabbitmq-diagnostics",
                  "-q",
                  "ping"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10,
              "failureThreshold": 5
            }
          }
        ],
        "volumes": [
          {
            "name": "rabbit-config",
            "configMap": {
              "name": "rabbitmq-config"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": "standard",
          "resources": {
            "requests": {
              "storage": "1Gi"
            }
          }
        }
      }
    ]
  }
}
