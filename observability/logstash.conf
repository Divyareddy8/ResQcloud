input {
  tcp {
    port => 5000
    codec => json_lines
    ecs_compatibility => disabled
  }
}

filter {
  mutate {
    add_field => {
      "project" => "resqcloud"
      "environment" => "development"
    }
  }

  if [time] {
    date {
      match => ["time", "UNIX"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "resqcloud-%{+yyyy.MM.dd}"
    ilm_enabled => false
    data_stream => false
    ecs_compatibility => disabled
  }

  stdout {
    codec => rubydebug
  }
}
